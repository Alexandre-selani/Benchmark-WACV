[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osr-tinyimagenet-benchmark"
version = "1.0.0"
description = "Open-set recognition benchmark on TinyImageNet: CAC, GFROR, COSTARR, OpenMax and OpenGan under a shared data loader and metric pipeline."
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

# Exactly the packages the benchmark imports. The version floors are the ones
# the reported results were produced with; environment.yml pins them exactly.
dependencies = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.8",
    "tqdm>=4.67.1",
    # Pulled in by the vendored pytorch_ood: importing pytorch_ood.detector
    # loads every detector, and some of them need these.
    "scipy>=1.15.3",
    "torchmetrics>=1.8.2",
    # NOTE: pytorch-ood is deliberately NOT a PyPI dependency. The OpenMax
    # detector this benchmark uses carries a local change, so it ships
    # vendored under third_party/. See third_party/NOTICE.
]

[tool.setuptools]
# core/ holds the shared loader, backbones and metrics; methods/ holds one
# package per open-set method. Both are installed from this single project, so
# `pip install -e .` is the only install step the benchmark needs.
package-dir = { Datasets = "core/Datasets", Models = "core/Models", Utils = "core/Utils", methods = "methods", pytorch_ood = "third_party/pytorch_ood" }

[tool.setuptools.packages.find]
where = ["core", ".", "third_party"]
include = ["Datasets*", "Models*", "Utils*", "methods*", "pytorch_ood*"]
